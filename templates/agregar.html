{% extends "base.html" %}
{% block content %}
<div class="page-title">Agregar tema</div>
<div class="page-sub">Busca un anime y selecciona su opening o ending</div>

{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}

<div id="agregar-layout" class="agregar-layout-single">

  <!-- Panel izquierdo: video + confirmar -->
  <div id="panel-video" class="panel-video" style="display:none;">
    <div class="video-wrapper">
      <video id="video-preview" controls preload="metadata" style="width:100%; border-radius:10px; background:#000;">
        <source id="video-preview-src" type="video/webm">
      </video>
    </div>

    <div class="video-info-box">
      <div class="detalle-header" style="margin-bottom: 16px;">
        <div id="v-tipo-badge" class="actividad-tipo op">OP1</div>
        <div>
          <div class="page-title" id="v-anime-nombre" style="font-size: 17px; margin-bottom: 2px;"></div>
          <div class="page-sub" id="v-basename" style="margin-bottom: 0;"></div>
        </div>
      </div>

      <div id="v-badges" class="badges-row" style="margin-bottom: 16px;"></div>

      <form method="POST" action="{{ url_for('guardar_tema') }}">
        <input type="hidden" name="anime_nombre" id="f-anime_nombre">
        <input type="hidden" name="anime_slug" id="f-anime_slug">
        <input type="hidden" name="tipo" id="f-tipo">
        <input type="hidden" name="numero" id="f-numero">
        <input type="hidden" name="video_url" id="f-video_url">
        <input type="hidden" name="nc" id="f-nc">
        <input type="hidden" name="resolution" id="f-resolution">
        <input type="hidden" name="source" id="f-source">
        <input type="hidden" name="spoiler" id="f-spoiler">
        <input type="hidden" name="version" id="f-version">
        <input type="hidden" name="episodes" id="f-episodes">
        <input type="hidden" name="basename" id="f-basename">
        <input type="hidden" name="imagen_url" id="f-imagen_url">

        <div class="form-group">
          <label class="form-label">Título de la canción <span>(opcional)</span></label>
          <input class="form-input" type="text" name="titulo_cancion" id="f-titulo_cancion" placeholder="Ej: Kaikai Kitan">
        </div>

        <div style="display: flex; gap: 10px;">
          <button class="btn btn-primary" type="submit" style="width: auto;">
            <i class="ti ti-plus"></i> Agregar a la lista
          </button>
          <button class="btn btn-secondary" type="button" onclick="cancelarSeleccion()">
            <i class="ti ti-x"></i> Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Panel derecho: búsqueda y resultados -->
  <div id="panel-busqueda" class="panel-busqueda">
    <div class="busqueda-box">
      <div class="form-group" style="margin-bottom: 10px;">
        <label class="form-label">Buscar anime</label>
        <div style="display: flex; gap: 8px;">
          <input class="form-input" type="text" id="buscar-input" placeholder="Ej: Demon Slayer, Frieren...">
          <button class="btn btn-primary" id="buscar-btn" onclick="buscarAnime()" style="width: auto; white-space: nowrap;">
            <i class="ti ti-search"></i> Buscar
          </button>
        </div>
      </div>

      <div id="resultados" style="display:none;">
        <div class="section-title" style="margin-bottom: 10px; font-size: 13px;">Resultados</div>
        <div id="resultados-lista"></div>
      </div>
    </div>
  </div>

</div>

<script>
async function buscarAnime() {
  const query = document.getElementById('buscar-input').value.trim();
  if (!query) return;

  const btn = document.getElementById('buscar-btn');
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Buscando...';
  btn.disabled = true;

  const resp = await fetch(`/api/buscar-anime?q=${encodeURIComponent(query)}`);
  const data = await resp.json();

  btn.innerHTML = '<i class="ti ti-search"></i> Buscar';
  btn.disabled = false;

  const lista = document.getElementById('resultados-lista');
  const contenedor = document.getElementById('resultados');

  if (!data.length) {
    lista.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">No se encontraron resultados.</p>';
    contenedor.style.display = 'block';
    return;
  }

  const grupos = {};
  data.forEach(r => {
    const key = `${r.anime_slug}__${r.tipo}${r.numero}`;
    if (!grupos[key]) {
      grupos[key] = { ...r, versiones: [] };
    }
    grupos[key].versiones.push(r);
  });

  lista.innerHTML = Object.values(grupos).map((g, i) => {
    const esOP = g.tipo === 'OP';
    const versiones = g.versiones.map((v, vi) => `
      <div class="version-item" onclick="seleccionarVersion(${i}, ${vi})">
        <span class="version-label">${v.tags || v.basename || 'v' + (vi + 1)}</span>
        <span class="version-badges">${generarBadgesHTML(v)}</span>
      </div>`).join('');

    const imgHTML = g.imagen_url
      ? `<img src="${g.imagen_url}" class="tema-portada" alt="${g.anime_nombre}" style="border-radius:0;">`
      : `<div class="tema-portada-placeholder">🎵</div>`;

    return `
      <div class="grupo-card">
        <div class="grupo-header" onclick="toggleGrupo(this)" style="padding:0; overflow:hidden;">
          ${imgHTML}
          <div style="display:flex; align-items:center; gap:10px; flex:1; padding: 12px 14px;">
            <div class="actividad-tipo ${esOP ? 'op' : 'ed'}">${g.tipo}${g.numero}</div>
            <div>
              <div class="grupo-anime">${g.anime_nombre}</div>
              <div class="grupo-cancion">${g.titulo_cancion || ''}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px; padding-right:14px; flex-shrink:0;">
            <span class="version-count">${g.versiones.length} versión${g.versiones.length > 1 ? 'es' : ''}</span>
            <i class="ti ti-chevron-down grupo-chevron"></i>
          </div>
        </div>
        <div class="grupo-versiones" style="display:none;">${versiones}</div>
      </div>`;
  }).join('');

  window._resultados = data;
  window._grupos = Object.values(grupos);
  contenedor.style.display = 'block';
}

function toggleGrupo(header) {
  const versiones = header.nextElementSibling;
  const chevron = header.querySelector('.grupo-chevron');
  const abierto = versiones.style.display !== 'none';
  versiones.style.display = abierto ? 'none' : 'flex';
  chevron.style.transform = abierto ? '' : 'rotate(180deg)';
}

document.getElementById('buscar-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') buscarAnime();
});
</script>
{% endblock %}
