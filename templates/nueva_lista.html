{% extends "base.html" %}
{% block content %}
<div class="page-title">Nueva lista</div>
<div class="page-sub">Crea tu lista personalizada de openings y endings</div>

{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}

<div class="agregar-box">
  <form method="POST">
    <div class="form-group">
      <label class="form-label">Nombre de la lista</label>
      <input class="form-input" type="text" name="nombre" placeholder="Ej: Mis openings favoritos" required>
    </div>
    <div class="form-group">
      <label class="form-label">Descripción <span>(opcional)</span></label>
      <textarea class="form-textarea" name="descripcion" placeholder="Describe tu lista..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Agregar temas</label>
      <input class="form-input" type="text" id="buscar-tema" placeholder="Filtrar temas..." style="margin-bottom:10px;">
      <div class="temas-checklist" id="temas-lista">
        {% for tema in temas %}
        <label class="tema-check-item">
          <input type="checkbox" name="temas_ids" value="{{ tema.id }}">
          <div class="actividad-tipo {{ 'op' if tema.tipo == 'OP' else 'ed' }}" style="font-size:10px; padding:2px 6px;">
            {{ tema.tipo }}{{ tema.numero }}
          </div>
          <span>{{ tema.anime_nombre }}</span>
          <span style="color:var(--text-faint); font-size:11px;">{{ tema.titulo_cancion or '' }}</span>
        </label>
        {% endfor %}
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-primary" type="submit" style="width:auto;">
        <i class="ti ti-check"></i> Crear lista
      </button>
      <a href="{{ url_for('listas') }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<script>
document.getElementById('buscar-tema').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.tema-check-item').forEach(item => {
    item.style.display = item.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
  });
});
</script>
{% endblock %}
